name: oidc-debug
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  show-sub:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims
        run: |
          TOKEN=$(curl -sLH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          python3 -c 'import sys,base64,json; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("sub:", c["sub"]); print("aud:", c["aud"])' "$TOKEN"
